  <body>
    <div id="instant-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;transition:opacity 0.4s ease;opacity:1;">
      <img src="/icons/cruixe-icon-1024.png" alt="PickMe" style="width:220px;height:220px;object-fit:contain;" fetchpriority="high" />
      <div style="width:140px;height:4px;border-radius:999px;background:rgba(184,17,4,0.12);overflow:hidden;margin-top:28px;">
        <div id="instant-splash-bar" style="height:100%;width:8%;border-radius:999px;background:#B81104;transition:width 0.35s ease;"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // inDrive-style splash: stays visible until the app's data bootstrap
      // signals ready (see src/hooks/useAppBootstrap.tsx), with a minimum
      // display time so it never "flashes".
      (function () {
        window.__splashReady = false;
        window.__splashMinDone = false;

        function tryHide() {
          if (!window.__splashReady || !window.__splashMinDone) return;
          var s = document.getElementById('instant-splash');
          if (!s) return;
          s.style.opacity = '0';
          setTimeout(function () { s.remove(); }, 400);
        }

        // Minimum branding display
        setTimeout(function () {
          window.__splashMinDone = true;
          tryHide();
        }, 400);

        // React calls window.__setSplashProgress(0-100) as each bootstrap
        // step (session, profile, favorites, trips, config, map) resolves.
        window.__setSplashProgress = function (pct) {
          var bar = document.getElementById('instant-splash-bar');
          if (bar) bar.style.width = Math.max(8, Math.min(100, pct)) + '%';
        };

        // React calls window.__dismissSplash() once the bootstrap resolves
        // (or its own ~6s timeout elapses and continues with cached data).
        window.__dismissSplash = function () {
          window.__splashReady = true;
          tryHide();
        };

        // Hard fallback only — the real dismiss is data-driven above. This
        // just guarantees the splash never gets stuck if React itself fails
        // to mount/bootstrap for some reason.
        setTimeout(function () {
          window.__splashMinDone = true;
          window.__splashReady = true;
          tryHide();
        }, 7000);

      })();
    </script>
