  <body>
    <div id="instant-splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#ffffff;transition:opacity 0.4s ease;opacity:1;">
      <img src="/icons/pickme-app-icon.png" alt="PickMe" style="width:220px;height:220px;object-fit:contain;" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // inDrive-style splash: stays visible until React app signals ready,
      // with a minimum display time so it never "flashes".
      (function () {
        window.__splashReady = false;
        window.__splashMinDone = false;

        function tryHide() {
          if (!window.__splashReady || !window.__splashMinDone) return;
          var s = document.getElementById('instant-splash');
          if (!s) return;
          s.style.opacity = '0';
          setTimeout(function () { s.remove(); }, 400);
        }

        // Minimum branding display
        setTimeout(function () {
          window.__splashMinDone = true;
          tryHide();
        }, 400);

        // React calls window.__dismissSplash() when the app is mounted
        window.__dismissSplash = function () {
          window.__splashReady = true;
          tryHide();
        };

        // Safety: dismiss once the page has fully loaded
        window.addEventListener('load', function () {
          setTimeout(function () { window.__dismissSplash(); }, 300);
        });

        // Hard fallback: never leave splash stuck
        setTimeout(function () {
          window.__splashMinDone = true;
          window.__splashReady = true;
          tryHide();
        }, 2000);

      })();
    </script>
  </body>
