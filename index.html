  <body>
    <style>
      html, body { background:#B81104; }
      @keyframes cruixe-spin {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
    <!-- Always-opaque red backdrop, sits directly under both splash layers
         and outlives their crossfade. Without it, two independently fading
         overlays both sitting below 100% opacity at the same instant expose
         whatever the app has already painted underneath (a map tile, a
         white unstyled frame) for a frame or two — this backdrop is what
         actually gets revealed in that gap instead, so it never happens. -->
    <div id="instant-splash-bg" style="position:fixed;inset:0;z-index:99997;background:#B81104;"></div>
    <div id="instant-splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#B81104;transition:opacity 0.4s ease;opacity:1;">
      <img src="/icons/cruixe-icon-1024.png" alt="CruiXe" style="width:130px;height:130px;object-fit:contain;" fetchpriority="high" />
    </div>
    <div id="instant-splash-2" style="position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:#B81104;opacity:0;pointer-events:none;transition:opacity 0.4s ease;">
      <div style="position:relative;width:62%;max-width:300px;aspect-ratio:853/1844;">
        <img src="/brand/cruixe-splash-tagline.png" alt="Let's CruiXe nicely." style="width:100%;height:100%;object-fit:contain;" />
        <div style="position:absolute;left:50%;top:94.5%;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#FFDD00;animation:cruixe-spin 0.8s linear infinite;"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // inDrive-style splash: stays visible until the app's data bootstrap
      // signals ready (see src/hooks/useAppBootstrap.tsx), with a minimum
      // display time so it never "flashes". A second, brand-tagline splash
      // then holds for a fixed beat before revealing the app underneath.
      (function () {
        window.__splashReady = false;
        window.__splashMinDone = false;

        // Start fetching/decoding the tagline image the instant the page
        // loads, well ahead of the 6s first splash — so it's already ready
        // to paint rather than popping in blank when the crossfade starts.
        var preloadTagline = new Image();
        preloadTagline.src = '/brand/cruixe-splash-tagline.png';

        var SECOND_SPLASH_DURATION = 6000;

        function showSecondSplash() {
          var first = document.getElementById('instant-splash');
          var second = document.getElementById('instant-splash-2');
          if (!second) return;
          second.style.opacity = '1';
          if (first) {
            first.style.opacity = '0';
            setTimeout(function () { first.remove(); }, 400);
          }
          setTimeout(function () {
            second.style.opacity = '0';
            setTimeout(function () {
              second.remove();
              var bg = document.getElementById('instant-splash-bg');
              if (bg) bg.remove();
            }, 400);
          }, SECOND_SPLASH_DURATION);
        }

        function tryHide() {
          if (!window.__splashReady || !window.__splashMinDone) return;
          showSecondSplash();
        }

        // First splash always holds for a fixed 6s, regardless of how fast
        // bootstrap resolves — it's a brand beat now, not a progress readout.
        setTimeout(function () {
          window.__splashMinDone = true;
          tryHide();
        }, 6000);

        // React calls window.__dismissSplash() once the bootstrap resolves
        // (or its own timeout elapses and continues with cached data). Still
        // gated by the 6s minimum above so it never cuts the brand beat short.
        window.__dismissSplash = function () {
          window.__splashReady = true;
          tryHide();
        };

        // Hard fallback only — the real dismiss is data-driven above. This
        // just guarantees the splash never gets stuck if React itself fails
        // to mount/bootstrap for some reason.
        setTimeout(function () {
          window.__splashMinDone = true;
          window.__splashReady = true;
          tryHide();
        }, 12000);

      })();
    </script>
  </body>
