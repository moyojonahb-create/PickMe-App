global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pickme-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["backend:3000"]
    authorization:
      credentials_file: /etc/prometheus/secrets/backend_metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
